name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Install browser for shelf layout
        run: npx playwright install --with-deps chromium
      - name: Shelf layout at 320 and 375
        run: npm run test:shelf
